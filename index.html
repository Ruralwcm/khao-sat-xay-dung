<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khảo sát Vấn đề Xây dựng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --red:#d71920; --navy:#1a3c6e; --gold:#ffc107; --green:#1e8e4e;
    --bg:#f4f6fb; --card:#fff; --line:#e5e9f2; --txt:#1c2434; --mut:#6b7280; }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:'Be Vietnam Pro',system-ui,sans-serif; background:var(--bg); color:var(--txt);
    min-height:100vh; padding:10px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:560px; margin:0 auto}
  .head{background:linear-gradient(135deg,var(--navy),#2c4a8a); color:#fff; border-radius:14px;
    padding:14px 16px; box-shadow:0 6px 18px rgba(26,60,110,.16)}
  .head h1{font-size:17px; font-weight:800; line-height:1.3}
  .head p{font-size:11.5px; opacity:.85; margin-top:4px}
  .badge{display:inline-block; background:rgba(255,255,255,.16); padding:3px 9px; border-radius:16px;
    font-size:11px; margin-top:8px}
  .card{background:var(--card); border-radius:12px; padding:14px; margin-top:10px;
    box-shadow:0 1px 6px rgba(20,30,60,.04); border:1px solid var(--line)}
  .card h2{font-size:14px; font-weight:700; color:var(--navy); margin-bottom:10px}
  label{font-size:11.5px; font-weight:600; color:var(--mut); display:block; margin:8px 0 4px}
  input,select,textarea{width:100%; font-size:14px; font-family:inherit; padding:10px 12px;
    border:1.5px solid var(--line); border-radius:10px; background:#fafbfd; color:var(--txt); outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--navy); background:#fff}
  .cas{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .cas select{width:100%}
  .cas label{margin:0 0 3px}
  .st-line{font-size:12.5px; font-weight:600; color:var(--txt); margin:2px 0}
  .sec{border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:10px; background:#fff}
  .sec .st{display:flex; align-items:center; gap:10px}
  .sec .st .name{flex:1; font-size:13.5px; font-weight:700}
  .radios{display:flex; gap:6px; flex-wrap:wrap}
  .radios label{margin:0; font-size:12px; font-weight:600; color:#4b5563; cursor:pointer;
    padding:7px 12px; border:1.5px solid var(--line); border-radius:18px; background:#fff; white-space:nowrap}
  .radios input{display:none}
  .radios label:has(input:checked){border-color:var(--green); color:var(--green); background:#e8f5e9}
  .radios label:has(input.ko):has(input:checked){border-color:var(--red); color:var(--red); background:#ffebee}
  .detail{display:none; margin-top:8px}
  .detail.show{display:block}
  .detail textarea{min-height:60px; font-size:13px}
  .detail input[type=date]{max-width:180px; font-size:13px; padding:8px 12px}
  .btn{width:100%; margin-top:12px; background:var(--red); color:#fff; border:none; border-radius:11px;
    padding:13px; font-size:15px; font-weight:800; font-family:inherit; cursor:pointer;
    box-shadow:0 5px 14px rgba(215,25,32,.28); transition:.15s}
  .btn:active{transform:scale(.98)} .btn:disabled{background:#b0b8c4; cursor:not-allowed; box-shadow:none; color:#fff}
  .toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(80px);
    background:#166534; color:#fff; padding:11px 20px; border-radius:10px; font-weight:600; font-size:13px;
    transition:.3s; box-shadow:0 6px 18px rgba(0,0,0,.18); z-index:50}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--red)}
  .foot{text-align:center; color:var(--mut); font-size:11px; margin-top:16px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
    z-index:999; padding:14px}
  .modal{background:#fff; border-radius:14px; padding:18px; max-width:380px; width:100%;
    box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .modal h3{font-size:15px; font-weight:700; margin-bottom:10px; color:var(--navy)}
  .modal .row{font-size:13px; padding:4px 0; border-bottom:1px solid var(--line)}
  .modal .row b{color:var(--navy)}
  .btn2{padding:9px 16px; border-radius:9px; font-size:13px; font-weight:700; border:none; cursor:pointer; flex:1}
  .btn2.act{background:var(--red); color:#fff}
  .btn2.ghost{background:#f4f6fb; color:var(--mut); border:1px solid var(--line)}
  .warn{display:none; background:var(--red); color:#fff; border-radius:10px; padding:10px 14px;
    margin-top:8px; font-weight:700; font-size:13px; animation:shake .4s}
  .warn.show{display:block}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .un-card{background:linear-gradient(135deg,#fff8e1,#fff3cd); border-radius:12px; padding:14px; margin-top:10px;
    border:1px solid var(--gold); display:none}
  .un-card h2{font-size:14px; font-weight:700; color:#8B6914; margin-bottom:6px}
  .un-card p{font-size:12px; color:var(--mut); margin-bottom:8px}
  .un-list{max-height:280px; overflow-y:auto; font-size:12.5px; line-height:1.8}
  .un-list .item{display:flex; align-items:center; gap:8px; padding:3px 0; border-bottom:1px solid rgba(0,0,0,.04)}
  .un-list .item .sap{font-weight:700; color:var(--navy); min-width:48px}
  .un-list .item .ten{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .un-badge{display:inline-block; background:var(--red); color:#fff; padding:1px 7px; border-radius:10px;
    font-size:11px; font-weight:700}
  .dash-link{display:inline; font-size:11px; color:var(--mut); 
    font-weight:500; text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🏗️ Khảo sát Vấn đề Xây dựng</h1>
    <p>Báo cáo hư hỏng hạ tầng cần sửa chữa tại cửa hàng</p>
    <span class="badge">5 hạng mục</span>
  </div>

  <div class="card">
    <h2>1️⃣ Chọn cửa hàng</h2>
    <div class="cas">
      <div><label>Miền</label><select id="selMien"><option value="">— Miền —</option></select></div>
      <div><label>Vùng (GĐV)</label><select id="selVung"><option value="">— Vùng —</option></select></div>
      <div><label>QLKV</label><select id="selQlkv"><option value="">— QLKV —</option></select></div>
      <div><label>Cửa hàng</label><select id="selCh"><option value="">— CH —</option></select></div>
    </div>
    <div style="margin-top:8px">
      <div class="st-line" id="vLine1">—</div>
      <div class="st-line" id="vLine2">—</div>
    </div>
  </div>

  <div class="card">
    <h2>2️⃣ Nội dung khảo sát</h2>
    <div id="issues"></div>
  </div>

  <div class="warn" id="warnBox"></div>
  <button class="btn" id="btnSubmit" disabled>📤 Gửi kết quả</button>

  <div class="un-card" id="unCard">
    <h2>🤝 Cùng nhắc đồng đội làm khảo sát bạn nhé!</h2>
    <p>QLKV <b id="unQlkv"></b> — <span id="unCount"></span></p>
    <div class="un-list" id="unList"></div>
  </div>

  <a class="dash-link" href="dashboard.html">📊 Xem Dashboard báo cáo tiến độ</a>
  <div class="foot">MsT ✨ — Rural Survey</div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="confirmOverlay" style="display:none">
  <div class="modal">
    <h3>📋 Xác nhận kết quả</h3>
    <div id="confirmBody"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn2 ghost" onclick="$('confirmOverlay').style.display='none'">🔙 Quay lại</button>
      <button class="btn2 act" onclick="doSubmit()">✅ Xác nhận gửi</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwPmh_Erk9eDbpNCMQePscfl067merQamb1xfvKbtjyUmjw3jTUU4Z43LzziuQb7H1X/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let STORES = [], selectedStore = null, doneSaps = new Set(), lastQlkv = '';

const ISSUES = [
  {key:'vh', name:'Hỏng vỉa hè', icon:'🧱'},
  {key:'dm', name:'Dột mái', icon:'🏠'},
  {key:'ts', name:'Tróc sơn tường', icon:'🎨'},
  {key:'tn', name:'Hỏng đường thoát nước', icon:'💧'},
  {key:'wc', name:'Hỏng nhà vệ sinh', icon:'🚽'}
];

function toggleDetail(radio) {
  const sec = radio.closest('.sec');
  const detail = sec.querySelector('.detail');
  detail.classList.toggle('show', radio.value === 'co');
}

function showToast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '') + ' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function callGet(params) {
  const qs = Object.keys(params).map(k => encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  const r = await fetch(GAS_URL + '?' + qs);
  return r.json();
}
async function call(data) {
  const r = await fetch(GAS_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(data)
  });
  return r.json();
}

// ─── Init ───
async function init() {
  const today = new Date().toISOString().split('T')[0];
  // Render issues với toggle Hiện tại / Quá khứ
  let html = '';
  ISSUES.forEach(iss => {
    html += `<div class="sec">
      <div class="st"><span class="name">${iss.icon} ${iss.name}</span>
        <div class="radios">
          <label><input type="radio" name="${iss.key}" value="khong" onchange="toggleDetail(this)">Không</label>
          <label><input type="radio" name="${iss.key}" value="co" class="ko" onchange="toggleDetail(this)">Có</label>
        </div>
      </div>
      <div class="detail" id="det_${iss.key}">
        <label>Diễn giải</label>
        <textarea id="dg_${iss.key}" placeholder="Mô tả chi tiết tình trạng..."></textarea>
        <label>Thời gian hỏng</label>
        <input type="date" id="tg_${iss.key}" style="max-width:180px" max="${today}">
      </div>
    </div>`;
  });
  $('issues').innerHTML = html;

  // Load stores from static JSON (reliable, no GAS dependency)
  try {
    const resp = await fetch('storelist.json');
    STORES = await resp.json();
    buildMien();
  } catch(e) {
    showToast('⚠️ Không tải được danh sách CH. F5 thử lại nhé.', true);
  }
}

// ─── Store cascade ───
function buildMien() {
  const miens = [...new Set(STORES.map(s => s.mien).filter(Boolean))].sort();
  const sel = $('selMien');
  sel.innerHTML = '<option value="">— Miền —</option>';
  miens.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; sel.appendChild(o); });
}

$('selMien').onchange = function() {
  $('selVung').innerHTML = '<option value="">— Vùng —</option>';
  $('selQlkv').innerHTML = '<option value="">— QLKV —</option>';
  $('selCh').innerHTML = '<option value="">— CH —</option>';
  resetStoreSelect();
  if (!this.value) return;
  const gdvs = [...new Set(STORES.filter(s => s.mien === this.value).map(s => s.gdv).filter(Boolean))].sort();
  gdvs.forEach(g => { const o = document.createElement('option'); o.value = g; o.textContent = g; $('selVung').appendChild(o); });
};

$('selVung').onchange = function() {
  $('selQlkv').innerHTML = '<option value="">— QLKV —</option>';
  $('selCh').innerHTML = '<option value="">— CH —</option>';
  resetStoreSelect();
  if (!this.value) return;
  const mien = $('selMien').value;
  const qlkvs = [...new Set(STORES.filter(s => s.gdv === this.value && s.mien === mien).map(s => s.qlkv).filter(Boolean))].sort();
  qlkvs.forEach(q => { const o = document.createElement('option'); o.value = q; o.textContent = q; $('selQlkv').appendChild(o); });
};

$('selQlkv').onchange = function() {
  $('selCh').innerHTML = '<option value="">— CH —</option>';
  resetStoreSelect();
  if (!this.value) return;
  const mien = $('selMien').value, gdv = $('selVung').value;
  const chs = STORES.filter(s => s.qlkv === this.value && s.gdv === gdv && s.mien === mien);
  chs.forEach(c => {
    const o = document.createElement('option');
    o.value = c.ma; o.textContent = c.ma + ' — ' + (c.ten || '').substring(0, 40);
    o.dataset.ten = c.ten || ''; o.dataset.tinh = c.tinh || '';
    o.dataset.huyen = c.huyen || ''; o.dataset.ngaykt = c.ngayKt || '';
    o.dataset.diachi = c.diaChi || ''; o.dataset.qlkv = c.qlkv || '';
    $('selCh').appendChild(o);
  });
};

$('selCh').onchange = function() {
  if (!this.value) { resetStoreSelect(); return; }
  const opt = this.selectedOptions[0];
  selectedStore = { ma: this.value, ten: opt.dataset.ten, tinh: opt.dataset.tinh, 
                    huyen: opt.dataset.huyen, ngayKt: opt.dataset.ngaykt,
                    diaChi: opt.dataset.diachi, qlkv: opt.dataset.qlkv };
  $('vLine1').textContent = esc(selectedStore.ma) + ' — ' + esc(selectedStore.ten);
  $('vLine2').textContent = '📅 KT: ' + esc(selectedStore.ngayKt || '—') + ' | 🏙️ ' + esc(selectedStore.tinh) + (selectedStore.huyen ? ' — ' + esc(selectedStore.huyen) : '');
  loadUnsurveyed();
  updateBtn();
};

function resetStoreSelect() {
  selectedStore = null;
  $('vLine1').textContent = '—'; $('vLine2').textContent = '—';
  $('unCard').style.display = 'none';
  updateBtn();
}

function updateBtn() {
  $('btnSubmit').disabled = !selectedStore;
}

// ─── Unsurveyed ───
async function loadUnsurveyed() {
  if (!selectedStore || !selectedStore.qlkv) return;
  lastQlkv = selectedStore.qlkv;
  try {
    const r = await callGet({action:'list', table:'xay_dung'});
    if (r.success && (r.rows || r.data)) {
      const list = r.rows || r.data || [];
      doneSaps = new Set(list.map(row => row.ma_ch).filter(Boolean));
    }
    showUnsurveyed();
  } catch(e) { doneSaps = new Set(); }
}

function showUnsurveyed() {
  if (!lastQlkv) { $('unCard').style.display = 'none'; return; }
  const mien = $('selMien').value, gdv = $('selVung').value;
  const allInQlkv = STORES.filter(s => s.qlkv === lastQlkv && s.gdv === gdv && s.mien === mien);
  const unsurveyed = allInQlkv.filter(s => !doneSaps.has(s.ma));
  
  if (unsurveyed.length === 0) {
    $('unCard').style.display = 'block';
    $('unQlkv').textContent = lastQlkv;
    $('unCount').innerHTML = '✅ <b>Tất cả đã làm khảo sát!</b>';
    $('unList').textContent = '';
    return;
  }
  
  $('unCard').style.display = 'block';
  $('unQlkv').textContent = lastQlkv;
  $('unCount').innerHTML = '<span class="un-badge">' + unsurveyed.length + '</span> CH chưa khảo sát / ' + allInQlkv.length + ' CH';
  
  let html = '';
  unsurveyed.forEach(s => {
    html += '<div class="item"><span class="sap">' + esc(s.ma) + '</span><span class="ten">' + esc(s.ten || '') + '</span></div>';
  });
  $('unList').innerHTML = html;
}

// ─── Submit ───
$('btnSubmit').onclick = function() {
  if (!selectedStore) return;
  const ngay = new Date().toISOString().split('T')[0];
  let html = '<div class="row"><b>CH:</b> ' + esc(selectedStore.ma) + ' — ' + esc(selectedStore.ten) + '</div>';
  html += '<div class="row"><b>Ngày:</b> ' + ngay + '</div>';
  html += '<div style="margin-top:8px;font-size:13px"><b>Vấn đề:</b></div>';
  let hasAny = false;
  let hasUnanswered = false;
  ISSUES.forEach(iss => {
    const radio = document.querySelector('input[name="'+iss.key+'"]:checked');
    if (!radio) { hasUnanswered = true; return; }
    if (radio.value === 'co') {
      hasAny = true;
      const tgVal = $('tg_'+iss.key).value || '—';
      html += '<div class="row">⚠️ <b>' + iss.name + '</b>: ' + esc($('dg_'+iss.key).value.trim()) + (tgVal !== '—' ? ' [' + tgVal + ']' : '') + '</div>';
    } else {
      html += '<div class="row">✅ ' + iss.name + ': Không</div>';
    }
  });
  if (hasUnanswered) {
    showToast('⚠️ Vui lòng chọn Có/Không cho tất cả 5 hạng mục', true);
    return;
  }
  if (!hasAny) html += '<div class="row">✅ Không có vấn đề nào</div>';
  $('confirmBody').innerHTML = html;
  $('confirmOverlay').style.display = 'flex';
};

async function doSubmit() {
  $('confirmOverlay').style.display = 'none';
  const btn = $('btnSubmit');
  btn.disabled = true; btn.textContent = '⏳ Đang gửi...';

  const ngay = new Date().toISOString().split('T')[0];
  const records = [];
  
  ISSUES.forEach(iss => {
    const radio = document.querySelector('input[name="'+iss.key+'"]:checked');
    if (radio && radio.value === 'co') {
      const tgVal = $('tg_'+iss.key).value || '';
      records.push({
        ma_ch: selectedStore.ma, ten_ch: selectedStore.ten,
        tinh: selectedStore.tinh, ngay_bao: ngay,
        van_de: iss.name, dien_giai: $('dg_'+iss.key).value.trim(),
        tg_hong: tgVal
      });
    }
  });
  if (records.length === 0) {
    records.push({
      ma_ch: selectedStore.ma, ten_ch: selectedStore.ten,
      tinh: selectedStore.tinh, ngay_bao: ngay,
      van_de: 'Không có vấn đề', dien_giai: '', tg_hong: ''
    });
  }

  let ok = 0, fail = 0;
  for (const rec of records) {
    try {
      const r = await call({action:'save', table:'xay_dung', data:rec});
      if (r.success) ok++; else fail++;
    } catch(e) { fail++; }
  }

  if (fail === 0) {
    showToast('✅ Đã gửi ' + ok + ' bản ghi!');
    doneSaps.add(selectedStore.ma);
    showUnsurveyed();
    $('selCh').value = ''; resetStoreSelect();
    ISSUES.forEach(iss => {
      document.querySelector('input[name="'+iss.key+'"][value="khong"]').checked = false;
      document.querySelector('input[name="'+iss.key+'"][value="co"]').checked = false;
      $('det_'+iss.key).classList.remove('show');
      $('dg_'+iss.key).value = ''; $('tg_'+iss.key).value = '';
    });
    updateBtn();
  } else {
    showToast('⚠️ Gửi ' + ok + '/' + records.length + '. ' + fail + ' lỗi.', true);
  }
  btn.textContent = '📤 Gửi kết quả';
}

init();
</script>
</body>
</html>
